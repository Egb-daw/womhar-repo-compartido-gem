<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <th:block th:replace="~{fragments/head :: head(#{msg.title} + ' - 500')}"></th:block>
</head>

<body class="womhat-body womhat-error-page d-flex flex-column h-100">

<header th:replace="~{fragments/header :: header(true)}"></header>

<main class="error-shell container py-4 py-lg-5">
    <section class="error-card">
        <div class="error-code-wrap">
            <i class="bi bi-exclamation-octagon" aria-hidden="true"></i>
            <p class="error-code" th:text="${status != null ? status : 500}">500</p>
        </div>

        <h1 class="error-title" th:text="#{msg.error.500.title}">Se ha producido un fallo inesperado</h1>

        <p class="error-tip mb-0" th:text="#{msg.error.500.tip}">
            Si el problema persiste, vuelve al inicio o prueba de nuevo más tarde.
        </p>

        <div class="error-actions">
            <a class="btn btn-primary" th:href="@{/}" th:text="#{msg.error.action.home}">Ir al inicio</a>
            <a class="btn btn-outline-primary"
               sec:authorize="isAuthenticated()"
               th:href="@{/dashboard}"
               th:text="#{msg.error.action.dashboard}">
                Ir al panel
            </a>
            <a class="btn btn-outline-primary"
               sec:authorize="isAnonymous()"
               th:href="@{/login}"
               th:text="#{msg.nav.login}">
                Iniciar sesión
            </a>
            <button class="btn btn-outline-secondary"
                    type="button"
                    onclick="history.back()"
                    th:text="#{msg.error.action.back}">
                Volver atrás
            </button>
        </div>

        <div class="error-meta" th:if="${status != null or error != null or message != null or path != null or timestamp != null}">
            <div class="error-meta-title" th:text="#{msg.error.meta.title}">Información técnica</div>
            <ul class="error-meta-list list-unstyled mb-0">
                <li th:if="${status != null}">
                    <span th:text="#{msg.error.meta.status}">Código</span>
                    <code th:text="${status}">500</code>
                </li>
                <li th:if="${error != null}">
                    <span th:text="#{msg.error.meta.reason}">Motivo</span>
                    <code th:text="${error}">Internal Server Error</code>
                </li>
                <li th:if="${message != null and !#strings.isEmpty(message)}">
                    <span th:text="#{msg.error.meta.message}">Mensaje</span>
                    <code th:text="${message}">Mensaje</code>
                </li>
                <li th:if="${path != null}">
                    <span th:text="#{msg.error.meta.path}">Ruta</span>
                    <code th:text="${path}">/ruta</code>
                </li>
                <li th:if="${timestamp != null}">
                    <span th:text="#{msg.error.meta.timestamp}">Fecha</span>
                    <code th:text="${timestamp}">timestamp</code>
                </li>
            </ul>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
