<th:block th:fragment="head(title)" xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          th:content="#{siteDescription}"
          content="WoMHAT: gestión visual y documentación técnica de racks, equipos y CPDs.">
    <meta name="author" content="David González y Eloy González">

    <title th:text="${title} ?: 'WoMHAT'">WoMHAT</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/Logo1.svg}">

    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800&family=Roboto:wght@400;500&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

    <script>
        (() => {
            const defaultTheme = 'dark';
            try {
                const savedTheme = localStorage.getItem('womhat_theme') || defaultTheme;
                document.documentElement.setAttribute('data-bs-theme', savedTheme);
                document.documentElement.style.colorScheme = savedTheme === 'light' ? 'light' : 'dark';
            } catch (error) {
                document.documentElement.setAttribute('data-bs-theme', defaultTheme);
                document.documentElement.style.colorScheme = defaultTheme;
            }
        })();
    </script>

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/assets/css/main.css(v=${assetVersion})}"
          href="/assets/css/main.css?v=dev">
</th:block>
