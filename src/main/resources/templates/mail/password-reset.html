<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${subject}">WoMHAT · Recuperación de cuenta</title>
</head>

<body style="margin:0;padding:0;background:#f3f6fb;font-family:'Roboto','Segoe UI',Arial,sans-serif;color:#0f1420;">
<table role="presentation" style="width:100%;border-collapse:collapse;border-spacing:0;background:#f3f6fb;">
    <tr>
        <td align="center" style="padding:36px 18px;">
            <table role="presentation" style="width:100%;max-width:620px;border-collapse:collapse;border-spacing:0;">
                <tr>
                    <td style="padding-bottom:18px;">
                        <div style="display:inline-flex;align-items:center;gap:12px;">
                            <span style="font-family:'Raleway','Segoe UI',Arial,sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;color:#0f1420;">
                                WoMHAT
                            </span>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="background:#ffffff;border:1px solid #e6ebf2;border-radius:24px;padding:34px 30px;box-shadow:0 18px 42px rgba(15,20,32,0.08);">

                        <h1 style="margin:0 0 14px 0;font-family:'Raleway','Segoe UI',Arial,sans-serif;font-size:30px;line-height:1.15;font-weight:900;letter-spacing:-0.04em;color:#0f1420;"
                            th:text="#{mail.passwordreset.title}">
                            Restablecer tu contraseña
                        </h1>

                        <p style="margin:0 0 24px 0;font-size:16px;line-height:1.75;color:#4f5e71;"
                           th:utext="#{mail.passwordreset.intro(${ttlMinutes})}">
                            Hemos recibido una solicitud para restablecer la contraseña de tu cuenta.
                            Este enlace caducará en <strong>30 minutos</strong>.
                        </p>

                        <table role="presentation" style="width:100%;border-collapse:collapse;border-spacing:0;margin:28px 0;">
                            <tr>
                                <td align="center">
                                    <a th:href="${resetUrl}"
                                       style="display:inline-block;padding:15px 24px;border-radius:16px;background:linear-gradient(135deg,#592EF2,#3B4AF7);color:#ffffff;text-decoration:none;font-size:15px;font-weight:800;letter-spacing:0.02em;box-shadow:0 16px 28px rgba(41,51,243,0.18);"
                                       th:text="#{mail.passwordreset.cta}">
                                        Establecer nueva contraseña
                                    </a>
                                </td>
                            </tr>
                        </table>

                        <div style="padding:16px 18px;border-radius:18px;background:#f8fafc;border:1px solid #e6ebf2;">
                            <p style="margin:0;font-size:14px;line-height:1.7;color:#5d6b7d;"
                               th:text="#{mail.passwordreset.note}">
                                Si no has solicitado este cambio, puedes ignorar este correo de forma segura.
                            </p>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:18px 8px 0;text-align:center;">
                        <p style="margin:0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#8a95a5;"
                           th:text="#{mail.footer}">
                            WoMHAT · Gestión Visual de Infraestructura
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
