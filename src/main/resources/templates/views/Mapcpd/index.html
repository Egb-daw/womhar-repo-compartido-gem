<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>DCIM - Gestión de Celdas y Equipos</title>
    <link rel="stylesheet" th:href="@{/assets/css/styles.css(v=${assetVersion})}" href="/assets/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="womhat-body">
<header class="main-header">
    <h1><i class="bi bi-diagram-3-fill me-2"></i>DCIM Manager</h1>
    <div class="controls">
        <div class="input-group">
            <span class="input-group-text">Cols</span>
            <input type="number" id="widthInput" class="form-control" value="4" min="1">
        </div>
        <div class="input-group">
            <span class="input-group-text">Filas</span>
            <input type="number" id="heightInput" class="form-control" value="4" min="1">
        </div>
        <button class="btn btn-primary btn-gen" onclick="generarCuadricula()">Generar Cuadrícula</button>
    </div>
</header>

<div class="main-layout">
    <div class="grid-panel">
        <div id="gridContainer" class="rack-grid-container">
        </div>
    </div>

    <div class="form-panel">
        <div id="emptyState" class="empty-state text-center py-5">
            <i class="bi bi-cursor-fill display-1 text-muted"></i>
            <p class="mt-3 text-muted">Selecciona una celda para gestionar su contenido.</p>
        </div>

        <div id="actionForm" style="display: none;" class="crud-card">
            <div class="form-header" id="formTitle">Configuración de Rack</div>

            <div class="form-body">
                <div class="form-group mb-3">
                    <label class="form-label">Nombre del Rack:</label>
                    <input type="text" id="editName" class="form-control" placeholder="Ej: Rack A1">
                </div>
                <div class="form-group mb-3">
                    <label class="form-label">Descripción:</label>
                    <textarea id="editDesc" class="form-control" rows="2" placeholder="Notas del rack..."></textarea>
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">Capacidad (U):</label>
                        <input type="number" id="editCapacity" class="form-control" value="42" min="1">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Color:</label>
                        <input type="color" id="editColor" class="form-control form-control-color w-100" value="#4CAF50">
                    </div>
                </div>
                <div id="buttonContainer" class="d-flex gap-2"></div>
            </div>

            <hr class="my-4">

            <div id="equipmentSection" class="equipment-section">
                <h3 class="h5 d-flex justify-content-between align-items-center">
                    Vista de Rack
                    <span class="badge bg-secondary" id="capacityDisplay">0 U</span>
                </h3>
                <div id="equipmentGrid" class="equipment-grid-vertical mt-3">
                </div>
                <button id="btnAddEquipment" class="btn btn-outline-primary w-100 mt-3" onclick="abrirModalEquipo(null)">
                    <i class="bi bi-plus-lg me-1"></i> Añadir Equipo
                </button>
            </div>
        </div>
    </div>
</div>

<div id="equipmentModal" class="modal-overlay" style="display: none;">
    <div class="custom-modal-content card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2 id="eqModalTitle" class="h5 mb-0">Gestión de Equipo</h2>
            <button class="btn-close" onclick="closeEquipmentModal()"></button>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Nombre del Equipo:</label>
                <input type="text" id="eqName" class="form-control" placeholder="Ej: Servidor ProLiant DL380">
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción / Modelo:</label>
                <textarea id="eqDesc" class="form-control" rows="2"></textarea>
            </div>
            <div class="row mb-3">
                <div class="col-6">
                    <label class="form-label">Función:</label>
                    <input type="text" id="eqFunc" class="form-control" placeholder="Ej: App Server">
                </div>
                <div class="col-6">
                    <label class="form-label">Altura (U):</label>
                    <input type="number" id="eqHeight" class="form-control" value="1" min="1">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo de Componente:</label>
                <select id="eqComp" class="form-select">
                    <option value="SERVER">Servidor</option>
                    <option value="SWITCH">Switch</option>
                    <option value="UPS">SAI / UPS</option>
                    <option value="PATCH">Patch Panel</option>
                    <option value="STORAGE">Almacenamiento</option>
                </select>
            </div>
            <div id="modalActions" class="modal-footer px-0 pb-0 gap-2"></div>
        </div>
    </div>
</div>

<script th:src="@{/assets/js/script.js(v=${assetVersion})}" src="/assets/js/script.js"></script>
</body>
</html>
