<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale}">
<head>
    <th:block th:replace="~{fragments/head :: head('WoMHAT · Room Form')}"></th:block>
</head>

<body class="d-flex flex-column h-100 womhat-body womhat-private-page womhat-user-page">
<header th:replace="~{fragments/header :: header(false)}"></header>

<main class="dashboard-layout womhat-main flex-grow-1">
    <aside class="dashboard-sidebar">
        <nav th:replace="~{fragments/sidebar :: sidebar(${active})}"></nav>
    </aside>

    <section class="dashboard-content">
        <div class="container-fluid px-4 room-form-view">
            <th:block th:replace="~{fragments/alerts :: flashMessages(false)}"></th:block>

            <div class="technical-detail-shell">
                <section class="surface-panel surface-panel--raised technical-hero">
                    <div class="technical-hero__head">
                        <div class="technical-hero__copy">
                            <span class="womhat-kicker mb-3">WoMHAT DCIM</span>

                            <div class="d-flex flex-column flex-xl-row align-items-xl-start justify-content-between gap-3">
                                <div>
                                    <h1 class="section-title technical-hero__title mb-2"
                                        th:text="${room.id == null} ? #{msg.room.form.title.new} : #{msg.room.form.title.edit}">
                                        Sala
                                    </h1>
                                    <p class="technical-hero__subtitle mb-0"
                                       th:text="#{msg.room.form.subtitle}">
                                        Formulario de creación y edición de salas.
                                    </p>
                                </div>

                                <div class="technical-hero__actions">
                                    <a th:href="@{/rooms}" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left me-1"></i>
                                        <span th:text="#{msg.room.form.action.back}">Volver</span>
                                    </a>
                                </div>
                            </div>

                            <ul class="womhat-tech-meta technical-hero__meta">
                                <li>
                                    <i class="bi bi-diagram-3"></i>
                                    <span class="fw-semibold" th:text="#{msg.form.meta.scope}">Ámbito</span>
                                    <span class="text-muted">·</span>
                                    <span th:text="#{msg.form.scope.infrastructure}">Infraestructura física</span>
                                </li>
                                <li>
                                    <i class="bi bi-pencil-square"></i>
                                    <span class="fw-semibold" th:text="#{msg.form.meta.mode}">Modo</span>
                                    <span class="text-muted">·</span>
                                    <span th:text="${room.id == null} ? #{msg.form.mode.create} : #{msg.form.mode.edit}">
                                        Alta
                                    </span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </section>

                <form th:action="${room.id == null} ? @{/rooms/insert} : @{/rooms/update}"
                      th:object="${room}"
                      method="post"
                      data-womhat-validate="true"
                      data-disable-on-submit="true">
                    <input type="hidden" th:field="*{id}"/>

                    <div class="alert alert-danger mb-4"
                         th:if="${#fields.hasAnyErrors()}"
                         th:text="#{msg.form.validation.review}">
                        Revisa los campos marcados antes de continuar.
                    </div>

                    <section class="crud-card technical-card">
                        <div class="crud-card-header technical-card__header">
                            <div>
                                <h2 class="technical-card__title mb-1" th:text="#{msg.room.form.section.main}">
                                    Datos principales de la sala
                                </h2>
                                <p class="mb-0 text-muted" th:text="#{msg.room.form.subtitle}">
                                    Formulario de creación y edición de salas.
                                </p>
                            </div>
                        </div>

                        <div class="p-3 p-md-4">
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="dataCenterId" class="form-label" th:text="#{msg.room.field.dataCenter}">CPD</label>
                                    <select id="dataCenterId"
                                            th:field="*{dataCenterId}"
                                            class="form-select"
                                            required
                                            th:classappend="${#fields.hasErrors('dataCenterId')} ? ' is-invalid' : ''">
                                        <option value="" th:text="#{msg.room.form.option.dataCenter.select}">
                                            -- Selecciona un CPD --
                                        </option>
                                        <option th:each="dc : ${dataCenters}"
                                                th:value="${dc.id}"
                                                th:text="${dc.code + ' · ' + dc.name}">
                                            CPD
                                        </option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('dataCenterId')}" class="invalid-feedback d-block" th:errors="*{dataCenterId}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="name" class="form-label" th:text="#{msg.room.field.name}">Nombre</label>
                                    <input id="name"
                                           type="text"
                                           th:field="*{name}"
                                           class="form-control"
                                           required
                                           maxlength="80"
                                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
                                           th:placeholder="#{msg.room.form.placeholder.name}"/>
                                    <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback d-block" th:errors="*{name}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="floor" class="form-label" th:text="#{msg.room.field.floor}">Planta</label>
                                    <input id="floor"
                                           type="text"
                                           th:field="*{floor}"
                                           class="form-control"
                                           maxlength="20"
                                           th:classappend="${#fields.hasErrors('floor')} ? ' is-invalid' : ''"
                                           th:placeholder="#{msg.room.form.placeholder.floor}"/>
                                    <div th:if="${#fields.hasErrors('floor')}" class="invalid-feedback d-block" th:errors="*{floor}"></div>
                                </div>

                                <div class="col-12">
                                    <label for="notes" class="form-label" th:text="#{msg.room.field.notes}">Notas</label>
                                    <textarea id="notes"
                                              th:field="*{notes}"
                                              class="form-control"
                                              th:classappend="${#fields.hasErrors('notes')} ? ' is-invalid' : ''"
                                              rows="4"
                                              maxlength="255"
                                              th:placeholder="#{msg.room.form.placeholder.notes}"></textarea>
                                    <div th:if="${#fields.hasErrors('notes')}" class="invalid-feedback d-block" th:errors="*{notes}"></div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end mt-4">
                        <a th:href="@{/rooms}" class="btn btn-outline-secondary"
                           th:text="#{msg.common.cancel}">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>
                            <span th:text="${room.id == null} ? #{msg.room.form.action.create} : #{msg.room.form.action.update}">
                                Guardar
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
